<style>
/* spreadsheet look, matching the user's Google Sheet: yellow month headers, grey section bands, green income, red expenses */
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);border-bottom:1px solid var(--line-strong)}
.top{display:flex;align-items:center;gap:6px;height:52px;max-width:1400px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yearnav{display:flex;align-items:center;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.2);border-radius:8px}

.iconbtn{background:none;border:0;padding:7px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.iconbtn:active{background:rgba(0,0,0,.08)}

.sync{width:10px;height:10px;border-radius:50%;background:#999;border:1px solid rgba(0,0,0,.25)}

main{max-width:1400px;margin:0 auto;padding-top:12px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line-strong);margin-bottom:16px;-webkit-overflow-scrolling:touch}
table.g{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
table.g td,table.g th{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap;font-size:13px;height:30px;min-width:66px;position:relative}

.caption{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 8px;flex-wrap:wrap}

.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);border-top:1px solid var(--line-strong);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

.sheet{position:fixed;inset:0;z-index:50;display:none}

table.g td.c.mk.paid{background:repeating-linear-gradient(135deg,var(--mc) 0 4px,#fff 4px 9px)!important;box-shadow:none}
table.g td .mkv{position:absolute;top:1px;left:3px;font-size:10px;color:#38761d;font-weight:800;font-style:normal}
table.g td .nr{position:absolute;bottom:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#d93025;box-shadow:0 0 0 1.5px #fff}
.nrdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d93025;vertical-align:-1px;flex:none}
.needbtn{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:11px 12px;border:1px dashed var(--line-strong);border-radius:10px;background:#fff;font-size:14px;cursor:pointer;color:var(--muted);text-align:start}
.needbtn .nrdot{background:#ddd}
.needbtn.on{border:1.5px solid #d93025;background:#fce8e6;color:#a61c00;font-weight:700}
.needbtn.on .nrdot{background:#d93025}
.mkbox{margin-top:14px;padding:12px;border:1px dashed var(--line-strong);border-radius:10px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mksw{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}
.mksw i,.mkpill i{flex:none;width:14px;height:14px;border-radius:4px;background:var(--c);border:1px solid rgba(0,0,0,.25);display:inline-block}
.mksw.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);font-weight:700}
.mkbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:13px}
.mkpill{flex:none;max-width:100%;display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.mkpill.late{border-color:#cc0000;color:#a61c00;font-weight:700}
.gcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-bottom:12px}
.gc{background:#fff;border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;cursor:pointer}
.gc:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.gc .t{font-weight:700;font-size:15.5px}.gc .sub{font-size:12.5px;color:var(--muted)}
.gc-top{display:flex;justify-content:space-between;gap:8px}
.gc-bal{text-align:left}.gc-bal .v{font-size:20px;font-weight:800;color:#38761d}
.gc-bar{height:8px;border-radius:4px;background:#d9ead3;margin:10px 0 6px;overflow:hidden}
.gc-bar i{display:block;height:100%;background:#93c47d;border-radius:4px}
.gc-foot{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.gcdone summary{cursor:pointer;font-weight:700;margin:6px 0 10px}
.gcdone .gc{opacity:.65}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px}
.ysearch{position:relative;display:flex;align-items:center;margin:0 0 10px}
.ysearch .input{padding-inline-start:38px;padding-inline-end:90px}
.ysearch .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.ysearch .ic svg{width:18px;height:18px}
.ysearch .n{position:absolute;left:44px;font-size:12px;color:var(--muted)}
.ysearch .iconbtn{position:absolute;left:4px}
.ysearch input::-webkit-search-cancel-button{display:none}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
</style>
