<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd966">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>הוצאות והכנסות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* spreadsheet look, matching the user's Google Sheet: yellow month headers, grey section bands, green income, red expenses */
:root{
  color-scheme:light;
  --page:#f1f3f4;--paper:#fff;--ink:#202124;--muted:#5f6368;--line:#b7b7b7;--line-strong:#666;
  --hdr:#ffd966;--lbl:#ffe599;--sec:#cccccc;--sec-dark:#b7b7b7;
  --inc:#6aa84f;--inc-soft:#b6d7a8;--inc-pale:#d9ead3;--inc-text:#38761d;
  --exp:#e06666;--exp-soft:#f4cccc;--exp-text:#cc0000;
  --purple:#b4a7d6;--purple-pale:#d9d2e9;--blue:#9fc5e8;--blue-pale:#cfe2f3;--orange:#f9cb9c;--orange-pale:#fce5cd;--yellow-pale:#fff2cc;
  --date:#6aa84f;--accent:#1a73e8;--accent-ink:#fff;--danger:#c5221f;--note:#e69138;
  --font:Rubik,Heebo,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--hdr)}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);border-bottom:1px solid var(--line-strong)}
.top{display:flex;align-items:center;gap:6px;height:52px;max-width:1400px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yearnav{display:flex;align-items:center;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.2);border-radius:8px}
.yearnav b{min-width:46px;text-align:center;font-size:16px;cursor:pointer}
.iconbtn{background:none;border:0;padding:7px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.iconbtn:active{background:rgba(0,0,0,.08)}
.iconbtn:focus-visible,.btn:focus-visible,.chip:focus-visible,td.c:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sync{width:10px;height:10px;border-radius:50%;background:#999;border:1px solid rgba(0,0,0,.25)}
.sync[data-s=ok]{background:#34a853}.sync[data-s=pending],.sync[data-s=syncing]{background:#fbbc04}.sync[data-s=error]{background:#ea4335}
main{max-width:1400px;margin:0 auto;padding-top:12px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line-strong);margin-bottom:16px;-webkit-overflow-scrolling:touch}
table.g{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
table.g td,table.g th{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap;font-size:13px;height:30px;min-width:66px;position:relative}
table.g th{font-weight:700}
table.g .lab{position:sticky;right:0;z-index:2;text-align:center;min-width:150px;max-width:190px;white-space:normal;line-height:1.25;font-weight:600;border-left:1px solid var(--line-strong);background:var(--paper)}
table.g tr.mh th{background:var(--hdr);font-size:12.5px}
table.g tr.mh th.lab{background:var(--hdr)}
table.g tr.mh.inc th.lab{background:var(--inc);color:#fff}
table.g tr.mh.exp th.lab{background:var(--exp);color:#fff}
table.g tr.sec td{background:var(--sec);font-weight:700;text-align:center;height:26px}
table.g tr.sec td.lab{background:var(--sec)}
table.g td.lab.l-inc{background:var(--lbl);color:var(--inc-text);font-weight:700}
table.g td.lab.l-exp{background:var(--lbl);color:var(--exp-text);font-weight:700}
table.g td.lab.l-grp{background:var(--sec-dark);color:var(--ink);font-weight:500}
table.g td.lab.l-prv{background:var(--paper);font-weight:500}
table.g td.c{cursor:pointer}
table.g td.c:hover{background:#e8f0fe}
table.g td.cur{background-image:linear-gradient(rgba(26,115,232,.07),rgba(26,115,232,.07))}
table.g th.cur{box-shadow:inset 0 -3px 0 var(--accent)}
table.g td.tot{font-weight:700;background:#f8f9fa}
table.g tr.r-inc td{background:var(--inc-soft);font-weight:700;font-size:13.5px}
table.g tr.r-exp td{background:var(--exp);color:#fff;font-weight:700;font-size:13.5px}
table.g tr.r-net td{background:var(--hdr);font-weight:700;font-size:13.5px}
table.g tr.r-pct td{background:var(--purple);font-weight:700}
table.g tr.r-rec td{background:var(--blue-pale);font-weight:600}
table.g tr.r-sub td{background:#f3f3f3;color:var(--muted);font-size:12px;height:24px}
table.g tr.r-sum td{background:var(--inc-pale);font-weight:600}
table.g td.neg{color:var(--danger)}
table.g tr.r-exp td.neg{color:#fff}
table.g td.note::after{content:"";position:absolute;top:0;left:0;border-top:7px solid var(--note);border-right:7px solid transparent}
table.g td.dates{direction:ltr;white-space:normal;color:var(--date);font-weight:500;font-size:12.5px;min-width:92px;max-width:130px;line-height:1.35}
table.g td.dates.paid{background:var(--inc-pale)}
table.g td.dates .du{color:var(--exp-text);font-weight:600}
table.g td.dates .dp{color:var(--date)}
.ccbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-right:5px solid #2e7dd7;border-radius:8px;padding:9px 12px;margin-bottom:12px;cursor:pointer}
.ccbar .n{font-size:18px;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums}
.ccbar .sp{flex:1}
.ck{display:grid;place-items:center;padding:4px}
.ck input{width:22px;height:22px;accent-color:var(--inc)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-inline-start:6px}
.pill.ok{background:var(--inc-pale);color:var(--inc-text)}.pill.no{background:var(--exp-soft);color:var(--exp-text)}
table.g tr.inv td{font-size:13px}
table.g tr.inv td.lab{font-weight:700}
.t-pension td{background:var(--purple-pale)}.t-pension td.lab{background:var(--purple)}
.t-gemel td{background:var(--orange-pale)}.t-gemel td.lab{background:var(--orange)}
.t-hish td{background:var(--yellow-pale)}.t-hish td.lab{background:var(--hdr)}
.t-policy td{background:var(--inc-pale)}.t-policy td.lab{background:var(--inc-soft)}
.t-liquid td{background:var(--blue-pale)}.t-liquid td.lab{background:var(--blue)}
.t-other td{background:#fff}.t-other td.lab{background:var(--blue-pale)}
.caption{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 8px;flex-wrap:wrap}
.caption h2{font-size:16px;margin:0}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 2px}
.btn{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.big{padding:13px;font-size:16px;width:100%}
.btn.sm{padding:5px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:15px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);border-top:1px solid var(--line-strong);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:700px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 1px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;line-height:1.15;color:var(--muted);cursor:pointer}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on svg{background:var(--hdr);border-radius:8px;box-shadow:0 0 0 4px var(--hdr)}
.fab{position:fixed;z-index:31;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:16px;border:1px solid rgba(0,0,0,.25);background:var(--hdr);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer}
.fab svg{width:30px;height:30px;stroke-width:2.5}
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet .pnl{position:absolute;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--page);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@media (min-width:700px){.sheet .pnl{bottom:auto;top:6vh;border-radius:14px;max-height:88vh}}
@media (prefers-reduced-motion:reduce){.sheet .pnl{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sh h3{margin:0;font-size:17px;flex:1}
.lbl{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 11px;font-size:16px}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount{display:flex;align-items:center;gap:6px;border-bottom:3px solid var(--hdr);margin-top:10px;direction:ltr;background:var(--paper);border-radius:8px 8px 0 0;padding:4px 10px}
.amount span{font-size:26px;color:var(--muted)}
.amount input{flex:1;border:0;background:none;font-size:38px;font-weight:700;outline:0;width:100%;direction:ltr;text-align:left;min-width:0}
.seg{display:flex;background:var(--sec);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on.e{background:var(--exp);color:#fff}.seg button.on.i{background:var(--inc);color:#fff}
.seg button.on.n{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--hdr);border-color:#b8962e;font-weight:700}
.chip.add{border-style:dashed;color:var(--muted)}
.grp-t{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px;background:var(--sec);padding:2px 8px;border-radius:4px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--sec);border-radius:999px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:22px;height:22px;top:3px;right:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+span{background:var(--inc)}
.sw input:checked+span:before{transform:translateX(-18px)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .sub{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:700;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--blue-pale);margin-inline-start:6px}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn.primary{flex:1}
.toast{position:fixed;z-index:60;left:50%;transform:translate(-50%,20px);bottom:calc(146px + env(safe-area-inset-bottom,0px));background:#202124;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--hdr);font-weight:700;cursor:pointer;text-decoration:underline}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--hdr);border-radius:8px;padding:9px 11px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.kpi.g{border-top-color:var(--inc)}.kpi.r{border-top-color:var(--exp)}.kpi.p{border-top-color:var(--purple)}
.big-result{text-align:center;padding:6px 0}
.big-result .n{font-size:42px;font-weight:700;line-height:1.1}
.big-result .u{color:var(--muted);font-size:14px}
.ymd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ymd div{background:var(--hdr);border-radius:8px;padding:10px;text-align:center}
.ymd b{display:block;font-size:24px}
.ymd span{font-size:12px}
.progress{height:14px;background:var(--sec);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.progress div{height:100%;background:var(--inc)}
.catedit{display:grid;grid-template-columns:1fr 1fr 60px 34px;gap:6px;margin-bottom:6px;align-items:center}
.catedit .input,.srcedit .input{padding:7px 9px;font-size:14px}
.srcedit{display:grid;grid-template-columns:1fr 34px;gap:6px;margin-bottom:6px}
.ltr{direction:ltr;unicode-bidi:isolate}
.neg{color:var(--danger)}.pos{color:var(--inc-text)}
.empty{color:var(--muted);text-align:center;padding:16px}
table.g td.rcpt::before{content:"";position:absolute;bottom:3px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.rbox{margin-top:10px;background:var(--paper);border:1px dashed var(--line-strong);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rbox.has{border-style:solid;border-color:var(--accent)}
.rbox .thumb{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--sec);flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted);cursor:pointer}
.rbox .info{flex:1;min-width:140px;font-size:13px;line-height:1.45}
.rbox .info b{font-size:14px}
.rbox .warn{color:#b45309}
.rbox label.btn{display:inline-flex;align-items:center;gap:6px}
.rbox label.btn svg{width:18px;height:18px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer[hidden]{display:none}
.viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));color:#fff}
.viewer .vbar a{color:#9fc5e8;font-weight:600}
.viewer .vbar .iconbtn{color:#fff}
.viewer .vbody{flex:1;overflow:auto;display:grid;place-items:center;color:#ddd}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.tgrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:0;overflow-x:auto;background:var(--paper);border:1px solid var(--line-strong);margin-bottom:12px}
.tgrid.one{grid-template-columns:1fr}
.tcol{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.tcol.today .th{background:#f6b26b}
.th{background:var(--hdr);font-weight:700;text-align:center;padding:7px 4px;border-bottom:1px solid var(--line-strong);font-size:14px}
.th small{font-weight:400;color:var(--muted);font-size:12px}
.tlist{flex:1;min-height:40px;padding:4px}
.tk{display:flex;align-items:flex-start;gap:4px;border:1px solid var(--line);border-radius:4px;margin-bottom:4px;background:var(--paper);font-size:13px;line-height:1.35;position:relative;cursor:grab}
.tk.dragging{opacity:.35}
.tk.done .tkt{text-decoration:line-through;opacity:.55}
.tkck{flex:none;width:20px;height:20px;margin:4px;border:1.5px solid #888;border-radius:4px;background:rgba(255,255,255,.7);cursor:pointer;font-size:12px;line-height:1;color:var(--inc-text);font-weight:700;padding:0}
.tkck.on{background:#00ff00;border-color:#2b8a2b;color:#000}
.tkt{flex:1;min-width:0;padding:4px 2px;cursor:pointer;word-break:break-word}
.tkx{flex:none;border:0;background:none;font-size:17px;line-height:1;padding:4px 6px;cursor:pointer;color:inherit;opacity:.35}
.tk:hover .tkx{opacity:.9}
@media (hover:hover){.tkx{opacity:0}}
.tph{height:26px;border:2px dashed var(--accent);border-radius:4px;margin-bottom:4px;background:#e8f0fe}
.tadd{border:0;border-top:1px dashed var(--line);padding:8px;font-size:14px;background:transparent;width:100%;outline:0}
.tadd:focus{background:#fffbe6}
.tband{background:#ffe599;font-weight:700;text-align:center;padding:7px;border:1px solid var(--line-strong);border-bottom:0}
.tlists{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-items:start;background:var(--paper);border:1px solid var(--line-strong);padding:10px}
.tlists .tcol{border:1px solid var(--line)}
.tnewlist{min-height:44px;border-style:dashed}
.tdays{display:flex;gap:5px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tdays .chip{display:flex;flex-direction:column;align-items:center;padding:5px 11px;line-height:1.2}
.tdays .chip small{font-size:11px;color:var(--muted)}
.tdays .chip.today:not(.on){border-color:#f6b26b;border-width:2px}
.tpal{display:flex;flex-wrap:wrap;gap:6px}
.tsw{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);cursor:pointer;color:var(--muted)}
.tsw.on{outline:3px solid var(--accent);outline-offset:1px}
.nwchart{position:relative;touch-action:pan-y}
.nwchart svg{width:100%;height:auto;display:block;stroke:none}
.nwchart svg text{stroke:none;font-family:inherit}
.nwtip{position:absolute;top:6px;width:180px;background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.15);pointer-events:none;line-height:1.5}
.nwtip i,.nwlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.nwlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-bottom:4px}
.nwlegend i.dash{width:16px;height:0;border-top:2px dashed #e69138;border-radius:0}
table.g tr.cur-row td{background:var(--yellow-pale)}
table.g td.c.mk{background:var(--mc)!important;box-shadow:inset 0 0 0 2px rgba(0,0,0,.28)}
table.g td.c.mk.paid{background:repeating-linear-gradient(135deg,var(--mc) 0 4px,#fff 4px 9px)!important;box-shadow:none}
table.g td .mkv{position:absolute;top:1px;left:3px;font-size:10px;color:#38761d;font-weight:800;font-style:normal}
table.g td .nr{position:absolute;bottom:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#d93025;box-shadow:0 0 0 1.5px #fff}
.nrdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d93025;vertical-align:-1px;flex:none}
.needbtn{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:11px 12px;border:1px dashed var(--line-strong);border-radius:10px;background:#fff;font-size:14px;cursor:pointer;color:var(--muted);text-align:start}
.needbtn .nrdot{background:#ddd}
.needbtn.on{border:1.5px solid #d93025;background:#fce8e6;color:#a61c00;font-weight:700}
.needbtn.on .nrdot{background:#d93025}
.mkbox{margin-top:14px;padding:12px;border:1px dashed var(--line-strong);border-radius:10px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mksw{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}
.mksw i,.mkpill i{flex:none;width:14px;height:14px;border-radius:4px;background:var(--c);border:1px solid rgba(0,0,0,.25);display:inline-block}
.mksw.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);font-weight:700}
.mkbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:13px}
.mkpill{flex:none;max-width:100%;display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.mkpill.late{border-color:#cc0000;color:#a61c00;font-weight:700}
.gcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-bottom:12px}
.gc{background:#fff;border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;cursor:pointer}
.gc:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.gc .t{font-weight:700;font-size:15.5px}.gc .sub{font-size:12.5px;color:var(--muted)}
.gc-top{display:flex;justify-content:space-between;gap:8px}
.gc-bal{text-align:left}.gc-bal .v{font-size:20px;font-weight:800;color:#38761d}
.gc-bar{height:8px;border-radius:4px;background:#d9ead3;margin:10px 0 6px;overflow:hidden}
.gc-bar i{display:block;height:100%;background:#93c47d;border-radius:4px}
.gc-foot{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.gcdone summary{cursor:pointer;font-weight:700;margin:6px 0 10px}
.gcdone .gc{opacity:.65}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px}
.ysearch{position:relative;display:flex;align-items:center;margin:0 0 10px}
.ysearch .input{padding-inline-start:38px;padding-inline-end:90px}
.ysearch .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.ysearch .ic svg{width:18px;height:18px}
.ysearch .n{position:absolute;left:44px;font-size:12px;color:var(--muted)}
.ysearch .iconbtn{position:absolute;left:4px}
.ysearch input::-webkit-search-cancel-button{display:none}
table.g.wd{width:100%}table.g.wd td,table.g.wd th{min-width:0;white-space:normal;padding:6px 4px}table.g.wd td.lab{width:34%}
.gr{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.gr:last-child{border-bottom:0}
.gr-ck{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line-strong);background:#fff;font-weight:900;color:#fff;cursor:pointer;font-size:16px;line-height:1}
.gr.need .gr-ck{background:#38761d;border-color:#38761d}
.gr-main{flex:1;min-width:0;cursor:pointer}.gr-main .t{font-size:15px}.gr-main .sub{font-size:12px;color:var(--muted)}
.gr.need .gr-main .t{font-weight:700}
.gr-q{color:#38761d;font-weight:700;font-size:13px}
.gr-p{flex:none;text-align:left;font-size:14px;cursor:pointer;white-space:nowrap}.gr-p small{display:block;font-size:11px;color:var(--muted)}
.gr-cat{font-weight:800;font-size:13px;color:var(--muted);margin:10px 0 2px;letter-spacing:.2px}
.dr{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.dr:last-child{border-bottom:0}.dr-main{flex:1;min-width:0}.dr-main .t{font-size:15px;font-weight:600}.dr .sub{font-size:12px;color:var(--muted)}
.dr-star{color:#e69138;font-size:12px;letter-spacing:1px}.dr-n{text-align:left;white-space:nowrap}
.dr.got{opacity:.6}.dr.got .t{text-decoration:line-through}
details.grd summary{cursor:pointer;list-style:none;padding:4px 0;font-size:15px;color:var(--ink)}details.grd summary::-webkit-details-marker{display:none}details.grd summary::before{content:"◂ ";color:var(--muted)}details.grd[open] summary::before{content:"▾ "}details.grd[open] summary{margin-bottom:4px}
table.g.lv td.lv-c b{display:block;font-weight:700}table.g.lv td.lv-c{white-space:normal;min-width:80px;max-width:120px;vertical-align:top}table.g.lv td.lv-a{vertical-align:top;color:var(--muted);font-size:12px;background:#fafafa;min-width:62px}table.g.lv tr.lv-sub th{font-size:11px;padding:3px}table.g.lv td.lab{white-space:normal;min-width:120px;max-width:160px;text-align:right}.lv-n{font-size:11px;font-weight:400;color:var(--muted);line-height:1.3;margin-top:2px}table.g.lv td.pos{color:var(--inc-text);font-weight:700}
table.g td.lab-c{cursor:pointer}.cn-ic{font-size:11px;margin-inline-start:4px}.cn-box{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:#fff8e1;border:1px solid #f1c232;border-radius:10px;padding:10px 12px;margin-bottom:10px}.cn-t{font-size:14px;line-height:1.5;word-break:break-word}.cn-t a{color:var(--accent)}
details.chg{background:#fff;border:1px solid var(--line-strong);border-radius:12px;padding:8px 12px;margin-bottom:12px}
details.chg summary{cursor:pointer;list-style:none;font-size:15px}details.chg summary::-webkit-details-marker{display:none}details.chg summary small{color:var(--muted);font-weight:400;margin-inline-start:6px}
.chg-l{margin-top:6px}.chg-r{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.chg-m{flex:1;min-width:0;cursor:pointer}.chg-m .sub{font-size:12.5px;color:var(--muted)}
.chg-r.done .gr-ck{background:#38761d;border-color:#38761d}.chg-r.done b{color:var(--muted)}
.chg-add{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;margin-top:8px}
@media(max-width:520px){.chg-add{grid-template-columns:1fr 1fr}.chg-add .btn{grid-column:1/-1}}
table.g.cmp td{white-space:normal;min-width:120px;max-width:200px;vertical-align:top;cursor:pointer;text-align:center}table.g.cmp td.lab{min-width:100px;cursor:default}table.g.cmp th{min-width:120px;white-space:normal}table.g.cmp td.chosen{background:#f3f8ef}table.g.cmp b.pos{color:#38761d}
.uppill{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:60;background:#202124;color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}.uppill[hidden]{display:none}
table.g.trk td b{display:block;font-weight:700}table.g.trk td small{display:block;font-size:11px}table.g.trk td small.pos{color:#38761d}table.g.trk td{vertical-align:top}
table.g.lv tr.r-stu td{background:#eef4fb;vertical-align:top}table.g.lv tr.r-stu td b{font-size:16px;display:block}table.g.lv tr.r-stu td.lab{background:#dbe7f6}
.stu-set{margin-top:12px;padding:10px 12px;background:#eef4fb;border-radius:10px}.stu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stu-grid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}@media(max-width:560px){.stu-grid{grid-template-columns:1fr}}
table.g.dep td.c{cursor:pointer}.goalp{padding:12px}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
